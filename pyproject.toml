[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devseatech-browser"
version = "0.1.0"
description = "DevSeaTech Universe — desktop browser proof of concept"
readme = "README.md"
license = "Proprietary"
requires-python = ">=3.11"
authors = [
    { name = "Enamul Mahian", email = "ea.mahian@gmail.com" },
]
dependencies = [
    "PySide6>=6.8,<7",
    "cryptography>=43,<46",
]

[project.scripts]
devseatech-browser = "devseatech_browser.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
