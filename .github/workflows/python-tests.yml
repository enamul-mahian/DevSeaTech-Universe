name: Python Unit Tests

on:
  push:
    branches: [main, "development/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall -q src tests
      - name: Install test dependencies
        # cryptography only (not the heavy GUI stack): lets the AF-02 backup
        # encryption round-trip, wrong-key and tamper tests run instead of skip.
        run: python -m pip install --upgrade pip "cryptography>=43,<46"
      - name: Run unit tests (logic + backup encryption)
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
