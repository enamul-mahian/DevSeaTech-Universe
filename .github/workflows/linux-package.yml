name: Linux Desktop Package Build

on:
  workflow_dispatch:
  push:
    branches: [development/packaging]
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "requirements.txt"

permissions:
  contents: read

jobs:
  linux-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system libraries for Qt WebEngine
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libnspr4 libdbus-1-3 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxrandr2 libxtst6 libxi6 libgbm1 libasound2t64 \
            libglib2.0-0 libegl1 libopengl0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Compile sources
        run: python -m compileall -q src

      - name: Build Linux package
        run: |
          python -m PyInstaller --noconfirm --clean \
            --name DevSeaTechBrowser \
            --paths src \
            --collect-all PySide6.QtWebEngineCore \
            --collect-all PySide6.QtWebEngineWidgets \
            src/devseatech_browser/app.py

      - name: Verify executable exists
        run: |
          test -f dist/DevSeaTechBrowser/DevSeaTechBrowser || {
            echo "Linux executable missing"
            exit 1
          }

      - name: Upload private CI build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevSeaTechBrowser-Linux-x64
          path: dist/DevSeaTechBrowser/
          retention-days: 7
          if-no-files-found: error
