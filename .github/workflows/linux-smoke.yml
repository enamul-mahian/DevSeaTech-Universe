name: Linux GUI Runtime Smoke

# Runtime verification, not packaging verification: this actually starts the
# Qt WebEngine runtime offscreen and constructs the real browser window. It
# fails if the application cannot start, which a PyInstaller/compile check does
# not catch.

on:
  workflow_dispatch:
  push:
    branches: [main, "development/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system libraries for headless Qt WebEngine
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libnss3 libnspr4 libdbus-1-3 libxkbcommon0 libxcomposite1 \
            libxdamage1 libxrandr2 libxtst6 libxi6 libgbm1 libasound2t64 \
            libglib2.0-0 libegl1 libopengl0
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run offscreen GUI runtime smoke
        env:
          PYTHONPATH: src
          QT_QPA_PLATFORM: offscreen
        run: python tests/smoke/gui_smoke.py
